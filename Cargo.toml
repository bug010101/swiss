[package]
name = "swiss"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "瑞士军刀式开发小工具箱：时间戳 / Base64 / URL / JSON / 命名转换 / 哈希 / UUID"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
digest = "0.10"
hex = "0.4"
md-5 = "0.10"
percent-encoding = "2.3"
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1.8", features = ["v4", "v7"] }

[profile.release]
lto = true
strip = true
